# Config: Baseline AASIST (clovaai/aasist)
architecture: aasist
pretrained_weights: models/weights/AASIST.pth
seed: 42
output_dir: runs/baseline_aasist

data:
  manifest_path: data/manifest.csv
  balanced_batch: false
  aug_noise: false
  aug_gain: false
  aug_codec: false

train:
  phase: phase1
  epochs: 25
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  schedule_lambda: false
  lambda_max: 0.0
